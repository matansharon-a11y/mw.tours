    return `<section class="ess" id="ess-${s.id}"><div class="bh"><span class="ring">${ic(s.icon)}</span><h3>${esc(c.title)}</h3>${count}</div>${c.intro ? `<p class="intro">${esc(c.intro)}</p>` : ''}${body}</section>`;
  }).join('');
  const P = T.phrases;
  const phr = P ? `<section class="ess" id="ess-phrases"><div class="bh"><span class="ring">${ic('chat')}</span><h3>${esc(P[lang].title)}</h3></div><p class="intro">${esc(P[lang].intro)}</p>
    <div class="phr">${P.words.map(w => `<div class="w${w.as ? '' : ' solo'}"><b dir="ltr" lang="${esc(P.lang || '')}">${esc(w.lat)}</b>${w.as ? `<span class="as" lang="${esc(P.script || P.lang || '')}">${esc(w.as)}</span>` : ''}<span>${lang === 'he' ? `${esc(w.he[1])} · ${esc(w.he[0])}` : esc(w.en)}</span></div>`).join('')}</div></section>` : '';
  const inst = `<section class="ess" id="ess-install"><div class="bh"><span class="ring">${ic('phone')}</span><h3>${esc(I.install.title)}</h3></div><ul>${I.install.text.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>`;
  $('#info').innerHTML = heroHTML('info', I.kicker, I.title, I.lede, qa) + `<div class="wrap">
    <div class="clocks" id="blk-time" style="--i:0"><div class="clock"><span>${esc(I.here)}</span><b id="clk-il">--:--</b></div><div class="clock"><span>${esc(I.there(T.region[lang]))}</span><b id="clk-as">--:--</b><small id="clk-diff"></small></div></div>
    <div class="facts" style="--i:1">${factsHTML()}</div>
    <section class="block" id="blk-flights" style="--i:2"><div class="bh"><span class="ring">${ic('plane')}</span><h3>${canTicket() ? esc(I.ticket) : I.flights}</h3>${canTicket() ? `<button class="rbtn plusb" type="button" data-ticket aria-label="${esc(I.ticket)}" title="${esc(I.ticket)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>` : ''}${inViewer ? '' : `<button class="rbtn" type="button" data-ics aria-label="${esc(I.cal)}" title="${esc(I.cal)}">${ic('calendar')}</button>`}</div>${myRows.length ? `<div class="flights">${flights}</div>` : `<div class="flights empty"><p>${esc(window.MW_AS ? I.flPrivate : I.noFlights)}</p></div>`}</section>
    <section class="block" id="blk-days" style="--i:3"><div class="bh"><span class="ring">${ic('calendar')}</span><h3>${esc(I.days)}</h3></div><div class="dlist">${days}</div></section>
    <section class="block" id="blk-stays" style="--i:4"><div class="bh"><span class="ring">${ic('bed')}</span><h3>${I.stays}</h3></div><div class="stays">${stays}</div></section>
    <section class="block" id="blk-weather" style="--i:5"><div class="bh"><span class="ring">${ic('sun')}</span><h3>${I.weather}</h3></div>
      <div class="wx">${weatherSVG(wx)}<p>${esc(wx[lang])}</p></div></section>
    <div class="egrid" style="--i:6">${ess}${phr}${inViewer ? '' : inst}</div>
    <p class="mapnote" style="--i:7">${esc(I.map)}: ${esc((GEO.credits || [GEO.credit, L.credit]).filter(Boolean).join(' · '))}</p>
  </div>`;
  renderClocks();
}
// Israel's clock follows its own summer time; the tour's clock is a fixed offset from UTC, or "tzName" for a place with summer time
function renderClocks() {
  const il = $('#clk-il'), as = $('#clk-as'); if (!il || !as) return;
  let asM = ((Date.now() / 6e4 + T.tz * 60) % 1440 + 1440) % 1440;
  if (T.tzName) try { const [th, tm] = new Intl.DateTimeFormat('en-GB', { timeZone: T.tzName, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()).split(':').map(Number); asM = th * 60 + tm; } catch (e) {}   // a place with summer time
  as.textContent = `${pad2(Math.floor(asM / 60))}:${pad2(Math.floor(asM % 60))}`;
  let ilT = null;
  try { ilT = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); } catch (e) {}
  if (!ilT) { il.parentElement.hidden = true; return; }
  il.textContent = ilT;
  const [h, m] = ilT.split(':').map(Number);
  let diff = (Math.floor(asM) - (h * 60 + m) + 1440) % 1440; if (diff > 720) diff -= 1440;
  const hrs = String(Math.abs(Math.round(diff / 30) / 2));
  $('#clk-diff').textContent = diff > 0 ? L.i.ahead(hrs) : diff < 0 ? L.i.behind(hrs) : L.i.same;
}
// the flights and the expedition dates as a calendar file
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
function downloadICS() {
  const title = `${T.title[lang].a} ${T.title[lang].b}`;
  const z = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const stamp = z(new Date().toISOString()), ymd = s => s.replace(/-/g, '');
  const endD = new Date(Date.parse(T.end + 'T00:00:00Z') + 864e5).toISOString().slice(0, 10);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MW Photo Tours//Tour companion//EN', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', `UID:${T.slug}-trip@mw.photography`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(T.days[0].date)}`, `DTEND;VALUE=DATE:${ymd(endD)}`,
    `SUMMARY:${icsEsc(`MW Photo Tours · ${title}`)}`, 'END:VEVENT'];
  const lt = (d, t) => `${d.replace(/-/g, '')}T${t.replace(':', '')}00`;   // a ticket's own local time
  // every flight in the Flights block: the tour's own (exact times) and the traveler's (their local times)
  flightRows().map(r => r.own != null ? { ...myTickets()[r.own], local: true } : r.preset ? { ...r, time: r.at, local: true } : r).filter(r => r.local ? r.iso && r.time : r.dep).forEach((r, i) => {
    lines.push('BEGIN:VEVENT', `UID:${T.slug}-flight-${i}@mw.photography`, `DTSTAMP:${stamp}`, `DTSTART:${r.local ? lt(r.iso, r.time) : z(r.dep)}`);
    if (r.arr && !r.local) lines.push(`DTEND:${z(r.arr)}`);
    lines.push(`SUMMARY:${icsEsc(r.cal ? tx(r.cal) : `${tx(r.flight)} · ${r.from} → ${r.to}${r.local && r.arrive ? ` · ${r.arrive}` : ''}`)}`, `DESCRIPTION:${icsEsc(`${L.i.calTitle}: ${title}`)}`);
    if (i === 0) lines.push('BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(r.cal ? tx(r.cal) : L.i.calDep)}`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' }));
    a.download = `${T.slug}.ics`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(L.toast.cal, 'calendar');
  } catch (e) {}
}
$('#info').addEventListener('click', e => {
  if (e.target.closest('[data-ics]')) { downloadICS(); return; }
  if (e.target.closest('[data-ticket]')) { addTickets(); return; }

  const j = e.target.closest('[data-jump]'); if (j) { goto('info:' + j.dataset.jump); return; }
  const d = e.target.closest('[data-dayrow]'); if (d) { const w = d.closest('.dday'), on = !w.classList.contains('open'); w.classList.toggle('open', on); d.setAttribute('aria-expanded', on); return; }
  const dm = e.target.closest('[data-daymap]'); if (dm) { backDay = INTRO; backRoom = { tab: 'info', day: +dm.dataset.daymap }; setTab('route'); setPlaying(false); goDay(+dm.dataset.daymap); return; }

function weatherSVG(wx) {
  // a range like −4–0°, kept left to right (and with a real minus) in Hebrew too
  const rg = (a, b) => `\u2066${String(a).replace('-', '\u2212')}–${String(b).replace('-', '\u2212')}°\u2069`;
  const I = L.i, rtl = lang === 'he';

  return `<svg viewBox="0 0 280 140" role="img" aria-label="${esc(`${I.morning} ${rg(wx.morning[0], wx.morning[1])}, ${I.day} ${rg(wx.day[0], wx.day[1])}`)}">
    <path d="M30 96 Q140 -8 250 96" fill="none" stroke="rgba(254,251,241,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#9CB1C2"/><circle cx="${b[0]}" cy="${b[1]}" r="6" fill="#E8A23E"/>
    <g transform="translate(128 28)" fill="none" stroke="#E8A23E" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 2.5v2.5m0 14v2.5M2.5 12H5m14 0h2.5M5.3 5.3 7 7m10 10 1.7 1.7m0-13.4L17 7M7 17l-1.7 1.7"/></g>
    <text x="${a[0]}" y="124" text-anchor="middle" fill="#F4F4F4" font-size="17" font-weight="700" font-family="Google Sans, Arial">${rg(wx.morning[0], wx.morning[1])}</text>
    <text x="${a[0]}" y="80" text-anchor="middle" fill="rgba(244,244,244,.6)" font-size="12" font-family="Google Sans, Arial">${esc(I.morning)}</text>
    <text x="${b[0]}" y="124" text-anchor="middle" fill="#F4F4F4" font-size="17" font-weight="700" font-family="Google Sans, Arial">${rg(wx.day[0], wx.day[1])}</text>
    <text x="${b[0]}" y="80" text-anchor="middle" fill="rgba(244,244,244,.6)" font-size="12" font-family="Google Sans, Arial">${esc(I.day)}</text>
  </svg>`;
}
$('#info').addEventListener('change', e => {

});

// ---------- leader ----------
// two or more leaders (vault `leaders: [{name, role, photo, roles, bio, story, wa, waText, phone, email, instagram, facebook, web}]`):
// one expandable card each, with that leader's details, contact and social links
function leaderCards(list) {
  const l = L.l;
  const faceOf = p => p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name[lang])}">`
    : `<span class="ini">${esc(p.name.en.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>`;
  const cline = (k, v) => v ? `<div class="cline"><b>${esc(k)}</b><span>${esc(v)}</span><button class="btn small" type="button" data-copy="${esc(v)}">${ic('copy')}<span>${esc(l.copy)}</span></button></div>` : '';
  return `<div class="lcards" style="--i:1">${list.map((p, i) => {
    const first = p.name[lang].split(' ')[0], st = p.story && p.story[lang];
    const acts = [
      p.wa ? `<a class="btn wa" href="https://wa.me/${p.wa}?text=${encodeURIComponent(tx(p.waText) || l.waText)}" target="_blank" rel="noopener">${ic('wa')}<span>${esc(l.waTo + first)}</span></a>` : '',
      p.instagram ? `<a class="btn" href="${esc(p.instagram)}" target="_blank" rel="noopener">${ic('ig')}<span>${esc(l.ig)}</span></a>` : '',
      p.facebook ? `<a class="btn" href="${esc(p.facebook)}" target="_blank" rel="noopener">${ic('fb')}<span>${esc(l.fb)}</span></a>` : '',
      p.web ? `<a class="btn" href="${esc(p.web)}" target="_blank" rel="noopener">${ic('globe')}<span>${esc(l.web)}</span></a>` : ''].join('');
    const lines = cline(l.phone, p.phone) + cline(l.mail, p.email);
    return `<div class="lcard"><button class="lhead" type="button" data-lcard aria-expanded="false"><span class="face">${faceOf(p)}</span><span><b class="nm">${esc(p.name[lang])}</b><small>${esc(p.role[lang])}</small></span>${ic('next')}</button>
      <div class="lpanel"><div><div class="lin">
        ${p.roles && p.roles.length ? `<div class="roles">${p.roles.map(r => `<div><b>${esc(r[lang][0])}</b><span>${esc(r[lang][1])}</span></div>`).join('')}</div>` : ''}
        ${p.bio ? `<div class="bio">${p.bio[lang].map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}
        ${st ? `<article class="lstory"><p class="lbl">${esc(st.kicker || '')}</p>${st.title ? `<h3>${esc(st.title)}</h3>` : ''}${st.by ? `<p class="by">${esc(st.by)}</p>` : ''}${st.text.map(t => `<p class="t">${esc(t)}</p>`).join('')}</article>` : ''}
        <section class="contact"><h3 style="margin:0;font-size:20px;color:var(--bark)">${esc(l.contactOf + first)}</h3>${acts ? `<div class="acts">${acts}</div>` : ''}${lines ? `<div class="clines">${lines}</div>` : ''}</section>
      </div></div></div></div>`;
  }).join('')}</div>`;
}

  $('#leader').innerHTML = `<div class="wrap">

    <div class="lead" style="--i:1"><div class="face">${face}</div><div><h2 class="tt ink"><span>${esc(first)}</span> <b>${esc(rest.join(' '))}</b></h2><p class="role">${esc(ld.role[lang])}</p></div></div>
    <div class="roles" style="--i:2">${ld.roles.map(r => `<div><b>${esc(r[lang][0])}</b><span>${esc(r[lang][1])}</span></div>`).join('')}</div>
    <div class="bioband no-ph${ld.story && ld.story[lang] ? ' has-story' : ''}" style="--i:3"><div class="bio">${ld.bio[lang].map(p => `<p>${esc(p)}</p>`).join('')}</div>${band}
    ${ld.story && ld.story[lang] ? `<article class="lstory"><p class="lbl">${esc(ld.story[lang].kicker || '')}</p>${ld.story[lang].title ? `<h3>${esc(ld.story[lang].title)}</h3>` : ''}${ld.story[lang].by ? `<p class="by">${esc(ld.story[lang].by)}</p>` : ''}${ld.story[lang].text.map(t => `<p class="t">${esc(t)}</p>`).join('')}</article>` : ''}</div>
    <section class="contact" style="--i:4"><h3 style="margin:0;font-size:24px;color:var(--bark)">${esc(l.contact)}</h3>
      <div class="acts"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">${ic('wa')}<span>${esc(l.wa)}</span></a>
        <a class="btn" href="${esc(ld.instagram)}" target="_blank" rel="noopener">${ic('ig')}<span>${esc(l.ig)}</span></a>${ld.web ? `
        <a class="btn" href="${esc(ld.web)}" target="_blank" rel="noopener">${ic('globe')}<span>${esc(l.web)}</span></a>` : ''}</div>
      <div>

        <div class="cline"><b>${esc(l.mail)}</b><span>${esc(ld.email)}</span><button class="btn small" type="button" data-copy="${esc(ld.email)}">${ic('copy')}<span>${esc(l.copy)}</span></button></div>

$('#leader').addEventListener('click', e => {
  const h = e.target.closest('[data-lcard]');
  if (h) { const c = h.closest('.lcard'), on = !c.classList.contains('open'); c.classList.toggle('open', on); h.setAttribute('aria-expanded', on); return; }
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const done = () => { b.lastElementChild.textContent = L.l.copied; setTimeout(() => { b.lastElementChild.textContent = L.l.copy; }, 1600); };
  const fallback = () => { const s = b.previousElementSibling, r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
});

// ---------- rooms ----------
function setTab(name, opts = {}) {
  const changed = tab !== name, fromPop = !!(history.state && history.state.pop);
  if (name !== 'route' && fromPop) closePop({ hist: true });
  tab = name;
  $$('#tabs button').forEach(b => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  ROOMS.forEach(r => { $('#' + r).hidden = r !== name; });
  if (name !== 'route') { setPlaying(false); closePop(); if (journeyOn) { seq++; endJourney(false); } }
  if (changed && name !== 'route' && !reduce) { const el = $('#' + name); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); el.scrollTop = 0; }
  if (name === 'route') backDay = INTRO;
  renderBack();
  if (opts.hist !== false && (changed || !fromPop)) hist(changed && !fromPop && opts.push !== false, { tab: name });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { if (b.dataset.tab !== tab) { backDay = INTRO; backRoom = null; } setTab(b.dataset.tab); } });
// a way home from every room: back to the map, and to the day you came from
let backDay = INTRO, backRoom = null;   // backRoom: the page you left for the map, e.g. the day-by-day schedule
function renderBack() {
  const b = $('#back'), off = tab === 'route' && !backRoom;
  b.hidden = off; document.body.classList.toggle('back-on-map', tab === 'route' && !off);
  b.lastElementChild.textContent = L.back; b.setAttribute('aria-label', L.back); b.title = L.back;
}
$('#back').addEventListener('click', () => {
  if (tab === 'route' && backRoom) {
    const r = backRoom; backRoom = null; setTab(r.tab);
    const row = r.day != null && $(`[data-dayrow="${r.day}"]`);
    if (row) { const w = row.closest('.dday'); w.classList.add('open'); row.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => requestAnimationFrame(() => w.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }))); }
    return;
  }
  const n = backDay;
  setTab('route');
  if (n !== INTRO && T.days.some(d => d.n === n)) { if (n !== current) goDay(n, false); else { cardOpen = true; renderCard('in'); } }
});
$('#tabs').addEventListener('keydown', e => {
  const d = { ArrowRight: lang === 'he' ? -1 : 1, ArrowLeft: lang === 'he' ? 1 : -1 }[e.key];
  if (!d) return;
  const n = ROOMS[(ROOMS.indexOf(tab) + d + ROOMS.length) % ROOMS.length]; setTab(n); $('#t-' + n).focus();
});

function open(quiet) {
  const gate = $('#gate');
  $('#shell').hidden = false;
  if (reduce || quiet) gate.hidden = true;
  else { gate.classList.add('leave'); setTimeout(() => { gate.hidden = true; }, 900); }
  buildMap(); renderAll();
  const r = mapEl.getBoundingClientRect(); W = r.width || innerWidth; H = r.height || innerHeight;
  settleLegs(-1); setView(fit(T.views.all));
  const st = tripState();
  const hash = location.hash.slice(1);
  setTab(ROOMS.includes(hash) ? hash : 'route', { push: false });
  if (st.k === 'during') goDay(st.n, false);
  else if (tab === 'route' && !store.get(KEY + '-seen') && !reduce) setTimeout(journey, quiet ? 300 : 700);
  setInterval(() => { renderChip(); if (tab === 'info') renderClocks(); }, 30e3);
  // on the site, keep the page, map and photos on the phone for the parks, where signal is thin
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

// ---------- start ----------
applyLang();
(async () => {
  const hash = location.hash.slice(1);
  if (hash === 'en' || hash === 'he') { lang = hash; store.set('mw-tour-lang', lang); applyLang(); }
  const saved = store.get(KEY + '-code');
  const fromHash = hash && !ROOMS.includes(hash) && hash !== 'en' && hash !== 'he' ? hash : '';
  if (fromHash && await tryCode(fromHash, true)) return;
  if (saved && await tryCode(saved, true)) return;
  $('#code').focus({ preventScroll: true });
})();
})();
